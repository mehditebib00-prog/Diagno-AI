# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/diagnoai_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8
spring.jackson.serialization.write-dates-as-timestamps=false

spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
# JWT Configuration
jwt.secret=diagnoai_jwt_secret_key_2026_secure_random_string_for_production_use
jwt.expiration=86400000

# Server Configuration
server.port=8080

# Ollama (local, free)
diagnoai.ollama.base-url=http://localhost:11434
diagnoai.ollama.embed-model=nomic-embed-text
diagnoai.ollama.chat-model=llama3
 
# RAG paths (relative to where you run the Spring Boot jar)
diagnoai.rag.medical-data-dir=medical_data
diagnoai.rag.knowledge-base-path=rag_knowledge_base.json
diagnoai.rag.chunk-size=800
diagnoai.rag.chunk-overlap=120
diagnoai.rag.top-k=3
 
# Set to true to auto-rebuild on every startup (slow but handy in dev)
diagnoai.rag.rebuild-on-startup=false